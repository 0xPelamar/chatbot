services:
  app:
    build: .
    container_name: telegram_bot_app
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      - POSTGRES_URL=postgres://user:pass@postgres:5432/chatbot?sslmode=disable
      - REDIS_URL=redis://redis:6379
    networks:
      - bot_network

  postgres:
    image: postgres:16.11-alpine3.23
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - bot_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - bot_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  bot_network:

volumes:
  postgres_data_prod:
  redis_data_prod: